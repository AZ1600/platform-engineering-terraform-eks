---
name: Terraform Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".tflint.hcl"
      - ".github/workflows/terraform-security.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  tflint:
    name: TFLint static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --call-module-type=local --format=compact


  trivy:
    name: Trivy IaC security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: Scan Terraform configuration
        run: |
          trivy config \
            --tf-exclude-downloaded-modules \
            --skip-dirs '**/.terraform' \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .
